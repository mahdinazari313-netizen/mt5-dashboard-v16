name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.2

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon
      working-directory: mt5dashboard

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mt5-dashboard-v16-debug
        path: mt5dashboard/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
